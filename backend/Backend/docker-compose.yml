version: '3.8'

services:
  # FastAPI Web Application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krugerx_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
